<!DOCTYPE html>
<html>
<head>
    <title>Final Bill - OM SAI ENTERPRISES</title>
    <style>
        body { font-family: Arial, sans-serif; background:#fff; }
        .header { text-align:center; margin:20px; }
        .header h1 { color:#007bff; }
        table { width:90%; margin:auto; border-collapse:collapse; }
        th, td { border:1px solid #ddd; padding:10px; text-align:center; }
        th { background:#007bff; color:white; }
        tr:nth-child(even) { background:#f9f9f9; }
        h3 { text-align:center; margin-top:20px; }
        .print-btn { display:block; margin:20px auto; padding:10px 20px; background:#28a745; color:white; border:none; border-radius:6px; cursor:pointer; }
        .print-btn:hover { background:#1e7e34; }
        @media print {
            .print-btn { display:none; } /* Print button hide ho jaayega */
            body { background:white; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧾 OM SAI ENTERPRISES</h1>
        <p>Customer Bill</p>
    </div>
    <table>
        <tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>
        {% for item in items %}
        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.qty }}</td>
            <td>₹{{ item.price }}</td>
            <td>₹{{ item.total }}</td>
        </tr>
        {% endfor %}
    </table>
    <h3>Grand Total: ₹{{ grand_total }}</h3>
    <button class="print-btn" onclick="window.print()">🖨️ Print Bill</button>
</body>
</html>
