<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f4f4; }
        .login-box { width:300px; margin:100px auto; padding:20px; background:white; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
        h2 { text-align:center; color:#007bff; }
        input { width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px; }
        button { width:100%; padding:10px; background:#007bff; color:white; border:none; border-radius:5px; font-weight:bold; }
        button:hover { background:#0056b3; }
        .error { color:red; text-align:center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
