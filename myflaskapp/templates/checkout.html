<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; text-align:center; }
        h1 { color:#28a745; }
        .box {
            width:400px; margin:50px auto; padding:20px;
            background:white; border-radius:8px;
            box-shadow:0 2px 6px rgba(0,0,0,0.2);
        }
        p { margin:8px 0; font-size:16px; }
        a.back-btn {
            display:inline-block; margin-top:20px; padding:10px 20px;
            background:linear-gradient(135deg, #007bff, #0056b3);
            color:white; text-decoration:none; border-radius:6px;
            font-weight:bold; transition:all 0.3s ease;
        }
        a.back-btn:hover { background:linear-gradient(135deg, #0056b3, #003d80); transform:scale(1.05); }
    </style>
</head>
<body>
    <div class="box">
        <h1>✅ Order Placed Successfully!</h1>
        <p><b>Customer:</b> {{ customer }}</p>
        <p><b>Email:</b> {{ email }}</p>
        <p><b>Address:</b> {{ address }}</p>
        <p><b>Total Amount:</b> ₹{{ total }}</p>
        <p>Thank you for shopping with us. Your order details have been saved.</p>
        <a href="/shop" class="back-btn">⬅ Back to Shop</a>
    </div>
</body>
</html>
