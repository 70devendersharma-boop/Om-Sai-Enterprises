<!DOCTYPE html>
<html>
<head>
    <title>Search Customer Orders</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; }
        .box { width:400px; margin:30px auto; padding:20px; background:white; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
        input { width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px; }
        button { padding:10px 20px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; }
        button:hover { background:#0056b3; }
        table { width:90%; margin:auto; border-collapse:collapse; margin-top:20px; }
        th, td { border:1px solid #ddd; padding:8px; text-align:center; }
        th { background:#007bff; color:white; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔍 Search Customer Orders</h2>
        <form method="POST">
            <input type="text" name="customer" placeholder="Enter Customer Name" required>
            <button type="submit">Search</button>
        </form>
    </div>

    {% if orders %}
    <h3 style="text-align:center;">Orders Found</h3>
    <table>
        <tr><th>Customer</th><th>Email</th><th>Address</th><th>Total</th><th>Action</th></tr>
        {% for o in orders %}
        <tr>
            <td>{{ o.customer }}</td>
            <td>{{ o.email }}</td>
            <td>{{ o.address }}</td>
            <td>₹{{ o.total }}</td>
            <td><a href="/confirm_billing/{{ o.customer }}" style="background:#28a745; color:white; padding:6px 12px; border-radius:5px; text-decoration:none;">Confirm Billing</a></td>
        </tr>
        {% endfor %}
    </table>
    {% endif %}
</body>
</html>
