<!DOCTYPE html>
<html>
<head>
    <title>Customer Login</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; }
        .box { width:350px; margin:100px auto; padding:20px; background:white; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
        h2 { text-align:center; color:#007bff; }
        input { width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px; }
        .btn {
            width:100%; padding:12px; margin-top:10px;
            background:linear-gradient(135deg, #007bff, #0056b3);
            color:white; font-weight:bold; border:none; border-radius:6px;
            cursor:pointer; transition:all 0.3s ease;
            box-shadow:0 3px 6px rgba(0,0,0,0.2);
        }
        .btn:hover { background:linear-gradient(135deg, #0056b3, #003d80); transform:scale(1.03); }
        .link { text-align:center; margin-top:15px; }
        .link a { color:#007bff; text-decoration:none; font-weight:bold; }
        .link a:hover { text-decoration:underline; }
        .error { color:red; text-align:center; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔑 Customer Login</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="link">
            <p>New user? <a href="/customer_signup">Sign Up</a></p>
        </div>
    </div>
</body>
</html>
