<!DOCTYPE html>
<html>
<head>
    <title>Customer Signup - OM SAI ENTERPRISES</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f6f9; }
        .box {
            width:350px; margin:80px auto; padding:25px;
            background:white; border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.15);
        }
        h2 { text-align:center; color:#007bff; margin-bottom:20px; }
        input {
            width:100%; padding:12px; margin:10px 0;
            border:1px solid #ddd; border-radius:6px;
            font-size:14px;
        }
        .btn {
            width:100%; padding:12px; margin-top:15px;
            background:linear-gradient(135deg, #28a745, #1e7e34);
            color:white; font-weight:bold; border:none; border-radius:6px;
            cursor:pointer; transition:all 0.3s ease;
            box-shadow:0 3px 6px rgba(0,0,0,0.2);
            font-size:15px;
        }
        .btn:hover {
            background:linear-gradient(135deg, #1e7e34, #155d27);
            transform:scale(1.03);
        }
        .link { text-align:center; margin-top:20px; font-size:14px; }
        .link a { color:#007bff; text-decoration:none; font-weight:bold; }
        .link a:hover { text-decoration:underline; }
        .message {
            text-align:center; margin:10px 0; font-size:14px;
            color:red;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>📝 Customer Signup</h2>
        {% if error %}
            <div class="message">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="message" style="color:green;">{{ success }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="address" placeholder="Address" required>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <div class="link">
            <p>Already have an account? <a href="/customer_login">Login</a></p>
        </div>
    </div>
</body>
</html>
